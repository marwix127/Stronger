name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce 80% line coverage
        shell: bash
        run: |
          coverage="$(awk -F: '
            /^LF:/ { total += $2 }
            /^LH:/ { hit += $2 }
            END { printf "%.2f", (hit / total) * 100 }
          ' coverage/lcov.info)"
          echo "Line coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage >= 80) }'

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - name: Install rules test dependencies
        run: npm ci --prefix firebase-tests

      - name: Test Firestore rules in the emulator
        run: >-
          npx --yes firebase-tools@15.17.0 emulators:exec
          --only firestore
          --project stronger-rules-test
          "npm test --prefix firebase-tests"
